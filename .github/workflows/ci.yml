name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev libpq-dev libmariadb-dev

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install sqlite postgresql@16 mariadb-connector-c pkg-config

      - name: Install system dependencies (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          echo "Windows CI uses MinGW or MSVC — SQLite bundled, Postgres/MySQL skipped"
          choco install make -y 2>/dev/null || true

      - name: Build
        shell: bash
        run: make release

      - name: Run unit tests
        shell: bash
        run: make test

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-dev luajit

      - name: Build
        run: make release

      - name: Run fuzz target
        shell: bash
        run: |
          if [ -f tests/sql/fuzz_split_statements.lua ]; then
            echo "Running fuzz target (100k iterations, 300s timeout)..."
            luajit tests/sql/fuzz_split_statements.lua --iterations=100000 --timeout=300
          else
            echo "Fuzz target not yet implemented — skipping"
          fi
